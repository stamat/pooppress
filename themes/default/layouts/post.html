{% extends "default.html" %}
{% block main %}
<article class="post">
  <header class="post-header">
    {# Stored site-root-relative (/uploads/…); strip to relative like the nav does. #}
    {% if page.featured_image %}
      <img class="featured-img" src="{{ relativePathPrefix }}{{ page.featured_image | replace('/uploads/', 'uploads/') }}" alt="">
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% include "meta-line.html" %}
  </header>
  <div class="post-body">
    {% block content %}{% endblock %}
  </div>
</article>
{% endblock %}
